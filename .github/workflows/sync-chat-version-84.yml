          SOURCE_ORIGINS = ['https://maayan-social-action.maayanbd519763.chatgpt.site', 'https://maayan-social-action.glossy-lyric-5649.chatgpt.site']
          TARGET_ORIGIN = "https://www.maayanrabinovich.co.il"
          def adapt(data, name):
              if Path(name).suffix not in {'.html','.css','.js','.xml','.txt','.svg'}:
                  return data
              text = data.decode('utf-8')
              for origin in SOURCE_ORIGINS:
                  text = text.replace(origin, TARGET_ORIGIN)
              if Path(name).suffix in {'.html', '.xml'}:
                  for filename in EXPECTED:
                      if filename.endswith('.html') and filename != 'index.html':
                          stem = filename[:-5]
                          text = text.replace(TARGET_ORIGIN + '/' + stem + '\"', TARGET_ORIGIN + '/' + filename + '\"')
                          text = text.replace(TARGET_ORIGIN + '/' + stem + '</loc>', TARGET_ORIGIN + '/' + filename + '</loc>')
              if name == 'sitemap.xml' and TARGET_ORIGIN + '/en.html' not in text:
                  text = text.replace('</urlset>', '<url><loc>' + TARGET_ORIGIN + '/en.html</loc></url></urlset>')
              return text.encode('utf-8')

          def download(item):
              name, expected_hash = item
              with urllib.request.urlopen(SOURCE_ORIGINS[0] + '/' + name, timeout=90) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected_hash:
                  raise RuntimeError('The source changed during sync: ' + name)
              return name, adapt(data, name)
          # Verify the complete snapshot before changing any repository files.
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              files = list(pool.map(download, EXPECTED.items()))
          for name, data in files:
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print('Synchronized and verified', len(files), 'files from ChatGPT Site version 84')
          PYTHON
      - name: Save the latest website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Sync website to ChatGPT Site version 84'
            git push
          fi
