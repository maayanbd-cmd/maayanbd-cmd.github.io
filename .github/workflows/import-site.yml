name: Import website source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-site.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Import verified website files
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, urllib.request
          base = "https://maayan-rabinovich.vercel.app/"
          expected = {'a-hug.html': 'd78cc22f509c8861b1a505a970bf781b666b67f7ed7c1c6745006757152b2c25', 'being-a-home.html': 'f53ecb61c96f0540474f51e89c727bd41d8e35a1b5bba62b9396587130e22886', 'being-heard.html': 'a0bd9e42545ca677364a64c85512a4e2930c2c0c53419267da9e78d3d0a43ca2', 'beyond-the-phone.html': '551ecc136ff1d53f5edc5d6126964930b33279c934dd228e7306793241363b9b', 'blog-preview.html': 'ae8544b16bcc63cbf9b4af9a1c925eae5f2d8e43ca198a97d86f336b551834f4', 'blog.css': '0cdd9d72b3394114c3acbe7d8daaa1784a3d4bcd94a22ab1eea6434c9985c6fe', 'blog.html': '2bd9bd0c461541608e23394ebb937b3c6e16e0f497a6eede047dbac5123c804d', 'cinnamon.html': 'c1207c0351c4574e474c1ccc06dc1f3a156883fbc63b666b66572c37e9805349', 'compass.html': '50e128f6222c3e52577173e66c899a0098c6fcb790fc1712265cd49b8a70b1af', 'different-noises.html': '62ed1e875e62ee912970de5090375f89f024be462af9da531e10210cfbc21d76', 'everyday-courage.html': '9ba0cf17efc9050033fb966943293d51a3cd4583d6986a43a398bee1ee40b928', 'finding-flowers.html': '2378477d196e7b15f7b25eada6deb2675e1d7bc1a052512582146b631648bc43', 'grandfather.html': '303f0825e1cc1645e8d752a5dd049217534f89873eb1232052e44d3b258eab7d', 'hosting-both-ways.html': 'a05aa06d8083ff0171c9e02b7b54d4708e5d458c8d5dbaa84c6cb463e26e2f2c', 'index.html': '78dd8b83367a7c009d50afacbaf1ecbb6b5156f350529353a0bc93757d8819b0', 'little-engine.html': 'a7d2dd6567cb583d1e863105a9642274a8c2077a49d5168892547cefec60a306', 'long-distance.html': 'bcd2175ded0a2ad6a4798cfa82a9243434e83c10bac7cbe2e46ce6aeaf05d656', 'maayan-480.webp': 'b0ff3419ab4e85b7d421f3cee8a4e38ca31282efad88ec73af033006e3a06498', 'maayan-960.webp': 'eaf467d1c316f10c8c421e9652f2dc19e143630ea0750b67b5e60d6094b40280', 'neighbors.html': '72bb511cc5ee50cc9068182c772439333865ec9dc7c19865da0d5684519f99ec', 'not-ashamed.html': '60a8f328dd6f876b84e7d4da90bff6bc42fb2cf228b483b1445c5a7c47d47437', 'one-starfish.html': '711516c045c146ee62caa52736db2c5e703881ab075762e9fcba64b827c45fac', 'photo-1.jpg': 'd44c5f86463f28d902fc24799db1ad23