          for name, digest in expected.items():
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError("Checksum mismatch: " + name)
              Path(name).write_bytes(data)
          Path("vercel.json").write_text('{"framework":null,"cleanUrls":false,"trailingSlash":false}\n')
          Path(".nojekyll").write_text("\n")
          print("Imported and verified", len(expected), "website files")
          PYTHON
      - name: Save website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete website source and assets'
            git push
          fi
